name: C++ Spike

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cpp-spike.yml'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - '.gitignore'
  pull_request:
    paths:
      - '.github/workflows/cpp-spike.yml'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - '.gitignore'

permissions:
  contents: read

jobs:
  windows:
    name: Windows MinGW13 / Qt 6.9.3
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Qt 6.11.2 exists only as a local build on the developer machine: the public
      # archive has no qt6_6112 (Updates.xml answers 404), so the aqt install this job
      # used to run failed every time and the whole spike job failed with it
      # (7 failed runs, found 2026-10-07). The newest PUBLISHED Qt is used instead -
      # the same one the release workflow installs, and the product only touches
      # stable Qt APIs, so both toolchains build the same code.
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          arch: win64_mingw
          tools: tools_mingw1310
          cache: true

      # The toolchain file reads VOICETYPER_MINGW_ROOT / VOICETYPER_QT_ROOT from the
      # environment; install-qt-action exports QT_ROOT_DIR and IQTA_TOOLS.
      - name: Export the toolchain roots
        shell: pwsh
        run: |
          if (-not (Test-Path "${{ env.IQTA_TOOLS }}\mingw1310_64\bin\g++.exe")) {
            Get-ChildItem "${{ env.IQTA_TOOLS }}" | ForEach-Object { Write-Host $_.Name }
            throw "no MinGW at ${{ env.IQTA_TOOLS }}\mingw1310_64"
          }
          "VOICETYPER_QT_ROOT=${{ env.QT_ROOT_DIR }}" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "VOICETYPER_MINGW_ROOT=${{ env.IQTA_TOOLS }}\mingw1310_64" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "${{ env.IQTA_TOOLS }}\mingw1310_64\bin" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure
        run: cmake --preset windows-mingw-release --fresh

      - name: Build
        run: cmake --build --preset windows-mingw-release --clean-first

      # The test executables are EXCLUDE_FROM_ALL by design - CMakeLists.txt documents
      # the aggregate target for exactly this - so a plain build leaves them out and
      # ctest then reports every test as "Not Run" (40 of 43, exit 1, found in the spike
      # job on 2026-10-07). They have to be built explicitly before ctest runs.
      - name: Build the tests
        run: cmake --build --preset windows-mingw-release --target voicetyper-tests

      - name: Test
        run: ctest --preset windows-mingw-release --output-on-failure

      - name: Install smoke
        shell: pwsh
        run: cmake --install build/windows-mingw-release --prefix "$env:RUNNER_TEMP\voicetyper-install"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-cpp-spike
          path: ${{ runner.temp }}\voicetyper-install

  arch:
    name: Arch Linux / Qt 6.11.x (hosted container)
    # Runs on a hosted runner inside an Arch container: the project needs Qt 6.9+,
    # which Ubuntu 24.04 does not ship, and the repository has no self-hosted Arch
    # runner (actions/runners -> total_count 0). Before this, the job was
    # workflow_dispatch-only with continue-on-error, so the Linux build, its tests
    # and the install smoke never actually ran on a push.
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    timeout-minutes: 90
    steps:
      # The JS actions below (checkout, upload-artifact) run inside this container,
      # so node has to exist before the first of them starts.
      - name: prepare the container
        run: |
          pacman -Syu --noconfirm --needed nodejs git

      - uses: actions/checkout@v4

      - name: Install Arch toolchain
        run: |
          pacman -S --noconfirm --needed \
            cmake make ninja \
            qt6-base qt6-wayland layer-shell-qt libpulse curl

      - name: Configure
        run: cmake --preset linux-arch-release

      - name: Build
        run: cmake --build --preset linux-arch-release --clean-first

      # Same reason as in the windows job: the test executables are EXCLUDE_FROM_ALL.
      - name: Build the tests
        run: cmake --build --preset linux-arch-release --target voicetyper-tests

      # A container has no display, and the UI suites create real widgets, so they
      # need Qt's offscreen platform; everything else is platform-independent.
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --preset linux-arch-release --output-on-failure

      - name: Install smoke
        run: cmake --install build/linux-arch-release --prefix "$RUNNER_TEMP/voicetyper-install"

      - uses: actions/upload-artifact@v4
        with:
          name: arch-cpp-spike
          path: ${{ runner.temp }}/voicetyper-install
