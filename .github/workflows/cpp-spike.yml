name: C++ Spike

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cpp-spike.yml'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - '.gitignore'
  pull_request:
    paths:
      - '.github/workflows/cpp-spike.yml'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - '.gitignore'

permissions:
  contents: read

jobs:
  windows:
    name: Windows MinGW13 / Qt 6.9.3
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Qt 6.11.2 exists only as a local build on the developer machine: the public
      # archive has no qt6_6112 (Updates.xml answers 404), so the aqt install this job
      # used to run failed every time and the whole spike job failed with it
      # (7 failed runs, found 2026-10-07). The newest PUBLISHED Qt is used instead -
      # the same one the release workflow installs, and the product only touches
      # stable Qt APIs, so both toolchains build the same code.
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          arch: win64_mingw
          tools: tools_mingw1310
          cache: true

      # The toolchain file reads VOICETYPER_MINGW_ROOT / VOICETYPER_QT_ROOT from the
      # environment; install-qt-action exports QT_ROOT_DIR and IQTA_TOOLS.
      - name: Export the toolchain roots
        shell: pwsh
        run: |
          if (-not (Test-Path "${{ env.IQTA_TOOLS }}\mingw1310_64\bin\g++.exe")) {
            Get-ChildItem "${{ env.IQTA_TOOLS }}" | ForEach-Object { Write-Host $_.Name }
            throw "no MinGW at ${{ env.IQTA_TOOLS }}\mingw1310_64"
          }
          "VOICETYPER_QT_ROOT=${{ env.QT_ROOT_DIR }}" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "VOICETYPER_MINGW_ROOT=${{ env.IQTA_TOOLS }}\mingw1310_64" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "${{ env.IQTA_TOOLS }}\mingw1310_64\bin" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure
        run: cmake --preset windows-mingw-release --fresh

      - name: Build
        run: cmake --build --preset windows-mingw-release --clean-first

      - name: Test
        run: ctest --preset windows-mingw-release --output-on-failure

      - name: Install smoke
        shell: pwsh
        run: cmake --install build/windows-mingw-release --prefix "$env:RUNNER_TEMP\voicetyper-install"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-cpp-spike
          path: ${{ runner.temp }}\voicetyper-install

  arch:
    name: Arch Linux / Qt 6.11.x (self-hosted, manual)
    # This job needs a self-hosted runner, and the repository currently has none
    # (actions/runners -> total_count 0), so on a push it would queue for ever and
    # hold the whole run's status. It is manual-only and non-blocking until such a
    # runner is registered; then the if/continue-on-error can be dropped.
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: [self-hosted, linux, arch]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Arch toolchain
        shell: bash
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo pacman -Syu --noconfirm git cmake make qt6-base
          else
            pacman -Syu --noconfirm git cmake make qt6-base
          fi

      - name: Configure
        run: cmake --preset linux-arch-release

      - name: Build
        run: cmake --build --preset linux-arch-release --clean-first

      - name: Test
        run: ctest --preset linux-arch-release --output-on-failure

      - name: Install smoke
        run: cmake --install build/linux-arch-release --prefix "$RUNNER_TEMP/voicetyper-install"

      - uses: actions/upload-artifact@v4
        with:
          name: arch-cpp-spike
          path: ${{ runner.temp }}/voicetyper-install
