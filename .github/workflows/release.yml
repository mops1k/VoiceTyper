# Builds and publishes a native VoiceTyper release: the runnable tree plus the Inno
# Setup installer the application's updater downloads.
#
# Trigger: pushing a tag like v1.2.0. The tag (without its 'v') becomes the product
# version, so the About page and the update check always agree with the release.
#
# The asset is named VoiceTyper-<version>-win64-Setup.exe: the frozen asset pattern in
# src/core/support/update_manifest.hpp matches it, and the "win64" marker is what
# src/app/windows_application.cpp requires before it lets an installer run.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without the leading v)'
        required: true

permissions:
  contents: write

jobs:
  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: version
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ github.event.inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'no version to build' }
          "value=$version" >> $env:GITHUB_OUTPUT

      # 6.11.2 exists only as a local build on the developer machine, so CI installs
      # the newest PUBLISHED Qt (6.9.3; the repository lists up to qt6_693) with the same
      # MinGW 13.1 toolchain the local preset uses. The project only touches stable Qt
      # APIs, so both toolchains build the same code.
      - name: install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          arch: win64_mingw
          tools: tools_mingw1310
          cache: true

      - name: install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      # The same preset the developer machine uses. It carries the toolchain file, and
      # the toolchain reads VOICETYPER_MINGW_ROOT / VOICETYPER_QT_ROOT from the
      # environment, which is what the two variables below provide: QT_ROOT_DIR is
      # exported by install-qt-action, and the MinGW 13.1 root sits under its tools
      # directory. A hand-written cmake command without the toolchain fails with
      # "Set VOICETYPER_MINGW_ROOT or MINGW_ROOT to a verified MinGW-w64 root".
      - name: build the deploy tree
        shell: pwsh
        env:
          VOICETYPER_QT_ROOT: ${{ env.QT_ROOT_DIR }}
          VOICETYPER_MINGW_ROOT: ${{ env.IQTA_TOOLS }}\mingw1310_64
        run: |
          if (-not (Test-Path "$env:VOICETYPER_MINGW_ROOT\bin\g++.exe")) {
            Get-ChildItem "$env:IQTA_TOOLS" | ForEach-Object { Write-Host $_.Name }
            throw "no MinGW at $env:VOICETYPER_MINGW_ROOT"
          }
          # The quotes are load-bearing: in PowerShell an unquoted -D...=2.0.0 is
          # parsed as an expression, the version is cut to "2" and ".0.0" is passed as
          # a separate argument, which cmake then tries to use as the preset name
          # ("Could not read presets from .../.0.0"). The same trap exists locally.
          cmake --preset windows-mingw-release "-DVOICETYPER_VERSION=${{ steps.version.outputs.value }}"
          cmake --build --preset windows-mingw-release --target voicetyper-deploy

      - name: build the installer
        shell: pwsh
        run: pwsh installer/build-native-installer.ps1 -Version ${{ steps.version.outputs.value }}

      - name: publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: build/windows-mingw-release/VoiceTyper-${{ steps.version.outputs.value }}-win64-Setup.exe
          generate_release_notes: true
