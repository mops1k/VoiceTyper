name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version from tag
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $tag = $tag.TrimStart('v')
          "VERSION=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore VoiceTyper.slnx

      - name: Build
        run: dotnet build VoiceTyper.slnx -c Release --no-restore -p:Version=${{ env.VERSION }} -p:AssemblyVersion=${{ env.VERSION }}.0 -p:FileVersion=${{ env.VERSION }}.0 -p:InformationalVersion=${{ env.VERSION }}

      - name: Test
        run: dotnet test VoiceTyper.Tests -c Release --no-build

      - name: Publish
        run: dotnet publish VoiceTyper.App -c Release -r win-x64 --self-contained true -p:Version=${{ env.VERSION }} -p:AssemblyVersion=${{ env.VERSION }}.0 -p:FileVersion=${{ env.VERSION }}.0 -p:InformationalVersion=${{ env.VERSION }} -o artifacts\publish

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' `
            installer\installer.iss `
            /DAppVersion=${{ env.VERSION }} `
            /DSourceDir=..\artifacts\publish `
            /DOutputDir=..\artifacts\installer

      - name: Compute SHA-256 of installer
        shell: pwsh
        run: |
          $hash = (Get-FileHash "artifacts\installer\VoiceTyper-${{ env.VERSION }}-Setup.exe" -Algorithm SHA256).Hash
          "SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Create GitHub Release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VoiceTyper ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            artifacts\installer\VoiceTyper-${{ env.VERSION }}-Setup.exe

      - name: Append SHA-256 to release body
        shell: pwsh
        run: |
          $notes = (gh release view ${{ github.ref_name }} --json body --jq '.body') -join [Environment]::NewLine
          $newBody = $notes + "`n`nSHA256: ${{ env.SHA256 }}"
          gh release edit ${{ github.ref_name }} --notes "$newBody"
        env:
          GH_TOKEN: ${{ github.token }}
