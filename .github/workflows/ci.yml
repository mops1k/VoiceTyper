name: CI

on:
  push:
    branches: [ actions, main ]
  pull_request:
    branches: [ actions, main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore VoiceTyper.slnx

      - name: Build
        run: dotnet build VoiceTyper.slnx -c Release --no-restore

      - name: Test
        run: dotnet test VoiceTyper.Tests -c Release --no-build
