name: C++ Spike

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cpp-spike.yml'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - '.gitignore'
  pull_request:
    paths:
      - '.github/workflows/cpp-spike.yml'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - '.gitignore'

permissions:
  contents: read

jobs:
  windows:
    name: Windows MinGW13 / Qt 6.11.2
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned aqtinstall
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --force-reinstall --no-cache-dir `
            git+https://github.com/miurahr/aqtinstall.git@8c3695d4a4e1ceabf6a74dc6c79681656dc6b74b

      - name: Install Qt 6.11.2 and MinGW 13.1
        shell: pwsh
        run: |
          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) {
            $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
          }
          if (-not (Test-Path $sevenZip)) {
            throw '7-Zip executable was not found for aqt extraction'
          }

          python -m aqt install-qt windows desktop 6.11.2 win64_mingw `
            -O "$env:RUNNER_TEMP\Qt" --base https://download.qt.io `
            --timeout 30 --external $sevenZip
          python -m aqt install-tool windows desktop tools_mingw1310 `
            qt.tools.win64_mingw1310 -O "$env:RUNNER_TEMP\QtTools" `
            --base https://download.qt.io --timeout 30 --external $sevenZip

          $qtConfig = Get-ChildItem "$env:RUNNER_TEMP\Qt" -Recurse -Filter Qt6Config.cmake |
            Select-Object -First 1
          $gpp = Get-ChildItem "$env:RUNNER_TEMP\QtTools" -Recurse -Filter g++.exe |
            Select-Object -First 1
          if (-not $qtConfig -or -not $gpp) {
            throw 'Qt6Config.cmake or MinGW g++.exe was not found after aqt install'
          }

          $qtRoot = [IO.Path]::GetFullPath((Join-Path $qtConfig.DirectoryName '../../../..'))
          $mingwRoot = Split-Path (Split-Path $gpp.FullName)
          "VOICETYPER_QT_ROOT=$qtRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "VOICETYPER_MINGW_ROOT=$mingwRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "$mingwRoot\bin" | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure
        run: cmake --preset windows-mingw-release --fresh

      - name: Build
        run: cmake --build --preset windows-mingw-release --clean-first

      - name: Test
        run: ctest --preset windows-mingw-release --output-on-failure

      - name: Install smoke
        shell: pwsh
        run: cmake --install build/windows-mingw-release --prefix "$env:RUNNER_TEMP\voicetyper-install"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-cpp-spike
          path: ${{ runner.temp }}\voicetyper-install

  arch:
    name: Arch Linux / Qt 6.11.x
    runs-on: [self-hosted, linux, arch]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Arch toolchain
        shell: bash
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo pacman -Syu --noconfirm git cmake make qt6-base
          else
            pacman -Syu --noconfirm git cmake make qt6-base
          fi

      - name: Configure
        run: cmake --preset linux-arch-release

      - name: Build
        run: cmake --build --preset linux-arch-release --clean-first

      - name: Test
        run: ctest --preset linux-arch-release --output-on-failure

      - name: Install smoke
        run: cmake --install build/linux-arch-release --prefix "$RUNNER_TEMP/voicetyper-install"

      - uses: actions/upload-artifact@v4
        with:
          name: arch-cpp-spike
          path: ${{ runner.temp }}/voicetyper-install
