# Builds and publishes a native VoiceTyper release: the runnable tree plus the Inno
# Setup installer the application's updater downloads.
#
# Trigger: pushing a tag like v1.2.0. The tag (without its 'v') becomes the product
# version, so the About page and the update check always agree with the release.
#
# The asset is named VoiceTyper-<version>-win64-Setup.exe: the frozen asset pattern in
# src/core/support/update_manifest.hpp matches it, and the "win64" marker is what
# src/app/windows_application.cpp requires before it lets an installer run.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without the leading v)'
        required: true

permissions:
  contents: write

jobs:
  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: version
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ github.event.inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'no version to build' }
          "value=$version" >> $env:GITHUB_OUTPUT

      # 6.11.2 exists only as a local build on the developer machine, so CI installs
      # the newest PUBLISHED Qt (6.9.3; the repository lists up to qt6_693) with the same
      # MinGW 13.1 toolchain the local preset uses. The project only touches stable Qt
      # APIs, so both toolchains build the same code.
      - name: install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.3'
          arch: win64_mingw
          tools: tools_mingw1310
          cache: true

      - name: install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: build the deploy tree
        shell: pwsh
        run: |
          cmake -S . -B build/windows-mingw-release -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ `
            -DVOICETYPER_VERSION=${{ steps.version.outputs.value }}
          cmake --build build/windows-mingw-release --target voicetyper-deploy

      - name: build the installer
        shell: pwsh
        run: pwsh installer/build-native-installer.ps1 -Version ${{ steps.version.outputs.value }}

      - name: publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: build/windows-mingw-release/VoiceTyper-${{ steps.version.outputs.value }}-win64-Setup.exe
          generate_release_notes: true
